[package]
name = "reliquary-cli"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
reliquary-memory = { path = ".." }
rpassword = "7.5"
serde_json = "1"
zeroize = "1"

[patch.crates-io]
quinn-proto = { path = "../vendor/quinn-proto" }
