[package]
name = "reliquary-cli"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
reliquary-memory = { path = ".." }
rpassword = "7.5"
serde_json = "1"
zeroize = "1"

[dev-dependencies]
reliquary-memory = { path = "..", features = ["test-support"] }

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
quinn-proto = { path = "../vendor/quinn-proto" }
