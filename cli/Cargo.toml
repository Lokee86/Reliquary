[package]
name = "reliquary-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1"
flate2 = "1"
reliquary-memory = { path = ".." }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Root-only Cargo patches must also be declared for the detachable CLI.
# Reuse Reliquary's exact Lore-compatible vendored copy.
[patch.crates-io]
quinn-proto = { path = "../vendor/quinn-proto" }
