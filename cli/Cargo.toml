[package]
name = "reliquary-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1"
flate2 = "1"
reliquary-memory = { path = ".." }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Match the parent package: Lore needs the vendor-patched QUIC transport API.
# The CLI is a standalone Cargo root, so the parent's patch does not propagate.
[patch.crates-io]
quinn-proto = { path = "../vendor/quinn-proto" }
