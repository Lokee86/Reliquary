[workspace]
exclude = ["cli", "experiments/lore-single-file-spike"]
members = [
    "crates/reliquary-archive",
    "crates/reliquary-memory-core",
    "crates/reliquary-echo",
    "crates/reliquary-graph",
    "crates/reliquary-perception-store",
    "crates/reliquary-entity-resolution",
    "crates/reliquary-freshness",
    "crates/reliquary-insomnia",
    "crates/reliquary-dream",
    "crates/reliquary-chronos",
    "crates/reliquary-ego",
    "crates/reliquary-retrieval",
    "crates/reliquary-context-engine",
    "crates/reliquary-vectors",
    "crates/reliquary-history",
    "crates/reliquary-container",
    "crates/reliquary-switchboard",
    "crates/reliquary-project-environment",
    "crates/reliquary-import",
    "crates/reliquary-maintenance",
    "crates/reliquary-runtime-gateway",
    "crates/reliquary-perception-store",
    "crates/reliquary-import-store",
    "crates/reliquary-maintenance-store",
    "crates/reliquary-external-index-store",
    "crates/reliquary-ego-store",
    "crates/reliquary-freshness-store",
    "crates/reliquary-vector-store",
    "crates/reliquary-insomnia-store",
    "crates/reliquary-dream-store",
    "crates/reliquary-owner-lifecycle",
]
default-members = ["."]
resolver = "3"

[package]
name = "reliquary-memory"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE.md"

[features]
history-oracle-fixtures = []
community-benchmarks = []
entity-calibration = []
freshness-performance-trace = []

[[example]]
name = "freshness_operation_baseline"
path = "examples/freshness_operation_baseline.rs"
required-features = ["freshness-performance-trace"]

[[example]]
name = "entity_admission_calibration"
path = "examples/entity_admission_calibration/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_calibration_run"
path = "examples/entity_calibration_run/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_calibration_distribution"
path = "examples/entity_calibration_distribution/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_validation_experiment"
path = "examples/entity_validation_experiment/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_resolution_experiment"
path = "examples/entity_resolution_experiment/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_disambiguation_experiment"
path = "examples/entity_disambiguation_experiment/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_store_resolution_experiment"
path = "examples/entity_store_resolution_experiment/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_jev_resolution_experiment"
path = "examples/entity_jev_resolution_experiment/main.rs"
required-features = ["entity-calibration"]

[dependencies]
reliquary-dream = { path = "crates/reliquary-dream" }
reliquary-entity-resolution = { path = "crates/reliquary-entity-resolution" }
reliquary-switchboard = { path = "crates/reliquary-switchboard" }
reliquary-chronos = { path = "crates/reliquary-chronos" }
reliquary-owner-lifecycle = { path = "crates/reliquary-owner-lifecycle" }
reliquary-external-index-store = { path = "crates/reliquary-external-index-store" }
reliquary-maintenance-store = { path = "crates/reliquary-maintenance-store" }
reliquary-import-store = { path = "crates/reliquary-import-store" }
reliquary-dream-store = { path = "crates/reliquary-dream-store" }
reliquary-freshness = { path = "crates/reliquary-freshness" }
reliquary-freshness-store = { path = "crates/reliquary-freshness-store" }
reliquary-ego-store = { path = "crates/reliquary-ego-store" }
reliquary-perception-store = { path = "crates/reliquary-perception-store" }
reliquary-graph = { path = "crates/reliquary-graph" }
reliquary-echo = { path = "crates/reliquary-echo" }
reliquary-memory-core = { path = "crates/reliquary-memory-core" }
reliquary-archive = { path = "crates/reliquary-archive" }
reliquary-container = { path = "crates/reliquary-container" }
reliquary-insomnia-store = { path = "crates/reliquary-insomnia-store" }
reliquary-insomnia = { path = "crates/reliquary-insomnia" }
reliquary-vector-store = { path = "crates/reliquary-vector-store" }
reliquary-vectors = { path = "crates/reliquary-vectors" }
reliquary-retrieval = { path = "crates/reliquary-retrieval" }
arcana = { git = "https://github.com/Lokee86/lexicon-arcana.git", rev = "66b4e96ecf18cc79dfd6b1ea30232bef7c86bba3" }
lodestone-packed = { git = "https://github.com/Lokee86/lodestone.git", rev = "7b4b3e02b2bd3f3e474fef1a31c8632f8bbea49f" }
lore = { git = "https://github.com/EpicGames/lore.git", rev = "c49390be048fa273ab47ff7d43bc4994ba7be8ce" }
sha2 = "0.10"
serde_json = "1"
aes-gcm = "0.10"
zeroize = "1"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
regex = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
reliquary-dream-store = { path = "crates/reliquary-dream-store", features = ["oracle-support"] }
reliquary-freshness-store = { path = "crates/reliquary-freshness-store", features = ["oracle-support"] }

# Lore pins a patched quinn-proto in its workspace. Dependency workspace patches
# do not propagate, so Reliquary vendors the exact copy from Lore c49390b.
[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }
