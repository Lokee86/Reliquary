[package]
name = "reliquary-runtime-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.26", features = ["v4"] }
reliquary-application = { path = "../reliquary-application" }
reliquary-owner-session = { path = "../reliquary-owner-session" }
reliquary-switchboard = { path = "../reliquary-switchboard" }

[dev-dependencies]
reliquary-memory-core = { path = "../reliquary-memory-core" }
reliquary-freshness-store = { path = "../reliquary-freshness-store" }
reliquary-archive = { path = "../reliquary-archive" }
reliquary-container = { path = "../reliquary-container" }
reliquary-vector-store = { path = "../reliquary-vector-store" }
