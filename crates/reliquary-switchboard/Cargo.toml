[package]
name = "reliquary-switchboard"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
aes-gcm = "0.10"
zeroize = "1"
base64 = "0.22"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
