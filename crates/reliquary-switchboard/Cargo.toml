[package]
name = "reliquary-switchboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
hex = "=0.4.3"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
