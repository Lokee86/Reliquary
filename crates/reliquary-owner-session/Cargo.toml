[package]
name = "reliquary-owner-session"
version = "0.1.0"
edition = "2024"
publish = false

[features]
oracle-support = []
d02-observation = []

[dependencies]
reliquary-container = { path = "../reliquary-container" }
reliquary-archive = { path = "../reliquary-archive" }
reliquary-memory-core = { path = "../reliquary-memory-core" }
reliquary-graph = { path = "../reliquary-graph" }
reliquary-perception-store = { path = "../reliquary-perception-store" }
reliquary-ego-store = { path = "../reliquary-ego-store" }
reliquary-freshness-store = { path = "../reliquary-freshness-store" }
reliquary-vector-store = { path = "../reliquary-vector-store" }
reliquary-insomnia-store = { path = "../reliquary-insomnia-store" }
directories = "6"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
lodestone-packed = { git = "https://github.com/Lokee86/lodestone.git", rev = "ba67b28a463b63c65e9dbe1120bd8205f1784cdd" }
