[package]
name = "reliquary-freshness-store"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reliquary-container = { path = '../reliquary-container' }
sha2 = '0.10'
serde = { version = '1', features = ['derive'] }
serde_json = '1'
uuid = { version = '1', features = ['v4'] }

[features]
default = []
oracle-support = []
